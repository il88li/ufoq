<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07070B">
  <title>دخول الإدارة — خيال</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-page">
  <form class="login-card" method="post" action="{{ url_for('admin_login') }}">
    <div class="login-logo">✦</div>
    <h1>خيال</h1>
    <p class="login-sub">لوحة التحكم</p>
    {% if error %}
    <div class="alert error">{{ error }}</div>
    {% endif %}
    <label class="field">
      <span>كلمة المرور</span>
      <input type="password" name="password" required autofocus placeholder="••••••••">
    </label>
    <button type="submit" class="btn-full">دخول</button>
  </form>
</body>
</html>
