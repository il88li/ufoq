<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07070B">
  <title>{% block title %}خيال{% endblock %}</title>
  <meta name="description" content="{% block description %}مكتبة البرومبتات العربية للذكاء الاصطناعي{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <!-- Loading Screen -->
  <div id="loader" class="loader" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-logo">
        <svg viewBox="0 0 80 80" width="80" height="80" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF6A2C"/>
              <stop offset="100%" stop-color="#7C5CFF"/>
            </linearGradient>
          </defs>
          <rect x="8" y="8" width="64" height="64" rx="18" fill="url(#g)"/>
          <path d="M40 22 L46 38 L64 38 L50 48 L55 64 L40 54 L25 64 L30 48 L16 38 L34 38 Z" fill="#fff" opacity="0.95"/>
        </svg>
      </div>
      <div class="loader-name">خيال</div>
      <div class="loader-bar"><div class="loader-bar-fill"></div></div>
      <div class="loader-text">جاري التحميل…</div>
    </div>
  </div>

  {% block body %}{% endblock %}

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <audio id="sfx-copy" preload="auto" src="{{ url_for('static', filename='sounds/copy.wav') }}"></audio>
  <audio id="sfx-like" preload="auto" src="{{ url_for('static', filename='sounds/like.wav') }}"></audio>
  <audio id="sfx-click" preload="auto" src="{{ url_for('static', filename='sounds/click.wav') }}"></audio>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
