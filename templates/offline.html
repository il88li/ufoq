<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07070B">
  <title>صيانة — {{ site_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:#07070B;color:#F4F4F7;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .box{max-width:400px}
    .icon{width:72px;height:72px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(135deg,#FF6A2C,#7C5CFF);display:grid;place-items:center;font-size:32px}
    h1{font-size:24px;margin-bottom:12px}
    p{color:#A8A8B4;line-height:1.7;font-size:15px}
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✦</div>
    <h1>{{ site_name }}</h1>
    <p>{{ message }}</p>
  </div>
</body>
</html>
